name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  database:
    name: Base de datos · migraciones e invariantes
    runs-on: ubuntu-latest
    services:
      postgres:
        # La misma versión mayor que el proyecto real (Supabase corre 17.11):
        # verificar contra una menor es verificar contra algo que no corremos.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7

      # Supabase provee los esquemas auth y storage; un Postgres pelado no. Los
      # stubs los suplen para poder verificar las migraciones sin Docker ni
      # cuenta. En Supabase real no se aplican.
      - name: Preparar lo que da Supabase
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/auth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/storage.sql

      - name: Aplicar migraciones en orden
        run: |
          for file in supabase/migrations/*.sql; do
            echo "──▶ $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Invariantes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/invariants.sql

      # Una migración que no se puede volver a aplicar sobre una base limpia
      # es una migración que no sirve: se comprueba en cada PR.
      #
      # storage también se tira: las políticas del bucket de marcas viven ahí y
      # no en public, así que sobrevivirían al borrado y la segunda pasada
      # fallaría por una política que ya existe.
      - name: Reaplicar desde cero
        run: |
          psql -v ON_ERROR_STOP=1 -c 'drop schema public cascade; create schema public; drop schema app cascade; drop schema storage cascade;'
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/auth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/storage.sql
          for file in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
