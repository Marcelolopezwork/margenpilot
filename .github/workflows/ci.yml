name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  database:
    name: Base de datos · migraciones e invariantes
    runs-on: ubuntu-latest
    services:
      postgres:
        # La misma versión mayor que el proyecto real (Supabase corre 17.11):
        # verificar contra una menor es verificar contra algo que no corremos.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7

      # Supabase provee los esquemas auth y storage; un Postgres pelado no. Los
      # stubs los suplen para poder verificar las migraciones sin Docker ni
      # cuenta. En Supabase real no se aplican.
      - name: Preparar lo que da Supabase
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/auth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/storage.sql

      - name: Aplicar migraciones en orden
        run: |
          for file in supabase/migrations/*.sql; do
            echo "──▶ $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Invariantes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/invariants.sql

      # Los datos de demostración pasan por las mismas puertas que la
      # aplicación —emitir, aprobar, cobrar, transferir, comprar, pagar—, así
      # que ejecutarlos aquí comprueba de una vez que las puertas siguen
      # aceptando lo que el guion les manda. Si alguien cambia la firma de una,
      # esto se pone rojo en el PR en vez de fallar delante de Marcelo cuando
      # pegue el archivo en el editor de Supabase.
      - name: Datos de demostración
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/seed/_datos-demo.sql
          psql -v ON_ERROR_STOP=1 -c "
            do \$$
            declare v_org uuid; v_cuantas int;
            begin
              select id into v_org from organizations where slug = 'margen-demo';
              if v_org is null then raise exception 'la demo no se creó'; end if;

              select count(*) into v_cuantas from cash_accounts where organization_id = v_org;
              if v_cuantas <> 3 then raise exception 'la demo necesita tres cuentas, hay %', v_cuantas; end if;

              select count(distinct status) into v_cuantas from quotes where organization_id = v_org;
              if v_cuantas < 5 then raise exception 'el tablero necesita varias columnas, hay % estados', v_cuantas; end if;

              select count(*) into v_cuantas from billing_documents
               where organization_id = v_org and direction = 'purchase';
              if v_cuantas <> 4 then raise exception 'faltan compras: hay %', v_cuantas; end if;

              select count(*) into v_cuantas from economic_facts where organization_id = v_org;
              if v_cuantas = 0 then raise exception 'la demo no produjo ningún hecho económico'; end if;

              raise notice 'Demo comprobada: % hechos económicos', v_cuantas;
            end \$$;"
          psql -v ON_ERROR_STOP=1 -f supabase/seed/borrar-demo.sql
          psql -v ON_ERROR_STOP=1 -c "
            do \$$
            begin
              if exists (select 1 from organizations where slug = 'margen-demo') then
                raise exception 'borrar-demo.sql no la quitó';
              end if;
            end \$$;"

      # Una migración que no se puede volver a aplicar sobre una base limpia
      # es una migración que no sirve: se comprueba en cada PR.
      #
      # storage también se tira: las políticas del bucket de marcas viven ahí y
      # no en public, así que sobrevivirían al borrado y la segunda pasada
      # fallaría por una política que ya existe.
      - name: Reaplicar desde cero
        run: |
          psql -v ON_ERROR_STOP=1 -c 'drop schema public cascade; create schema public; drop schema app cascade; drop schema storage cascade;'
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/auth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/storage.sql
          for file in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
