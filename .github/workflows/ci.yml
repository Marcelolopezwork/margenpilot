name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  database:
    name: Base de datos · migraciones e invariantes
    runs-on: ubuntu-latest
    services:
      postgres:
        # La misma versión mayor que el proyecto real (Supabase corre 17.11):
        # verificar contra una menor es verificar contra algo que no corremos.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7

      # Supabase provee los esquemas auth y storage; un Postgres pelado no. Los
      # stubs los suplen para poder verificar las migraciones sin Docker ni
      # cuenta. En Supabase real no se aplican.
      - name: Preparar lo que da Supabase
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/auth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/storage.sql

      - name: Aplicar migraciones en orden
        run: |
          for file in supabase/migrations/*.sql; do
            echo "──▶ $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Invariantes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/invariants.sql

      # Los datos de demostración pasan por las mismas puertas que la
      # aplicación —emitir, aprobar, cobrar, transferir, comprar, pagar—, así
      # que ejecutarlos aquí comprueba de una vez que las puertas siguen
      # aceptando lo que el guion les manda. Si alguien cambia la firma de una,
      # esto se pone rojo en el PR en vez de fallar delante de Marcelo cuando
      # pegue el archivo en el editor de Supabase.
      - name: Datos de demostración
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/seed/_datos-demo.sql
          psql -v ON_ERROR_STOP=1 -c "
            do \$$
            declare v_org uuid; v_cuantas int;
            begin
              select id into v_org from organizations where slug = 'margen-demo';
              if v_org is null then raise exception 'la demo no se creó'; end if;

              select count(*) into v_cuantas from cash_accounts where organization_id = v_org;
              if v_cuantas <> 3 then raise exception 'la demo necesita tres cuentas, hay %', v_cuantas; end if;

              select count(distinct status) into v_cuantas from quotes where organization_id = v_org;
              if v_cuantas < 5 then raise exception 'el tablero necesita varias columnas, hay % estados', v_cuantas; end if;

              select count(*) into v_cuantas from billing_documents
               where organization_id = v_org and direction = 'purchase';
              if v_cuantas <> 4 then raise exception 'faltan compras: hay %', v_cuantas; end if;

              select count(*) into v_cuantas from economic_facts where organization_id = v_org;
              if v_cuantas = 0 then raise exception 'la demo no produjo ningún hecho económico'; end if;

              -- Aprobar la cotización de dos líneas tuvo que dejar dos trabajos.
              select count(*) into v_cuantas from jobs where organization_id = v_org;
              if v_cuantas <> 2 then raise exception 'la demo necesita dos trabajos, hay %', v_cuantas; end if;

              -- Y el costo del trabajo cuenta el NETO de su factura, no el total:
              -- el IGV de una compra es crédito fiscal (INV-12.2, INV-14.5).
              if not exists (
                select 1 from job_margins m
                 where m.organization_id = v_org
                   and m.costo_neto = (select d.amount_net from billing_documents d
                                        where d.organization_id = v_org
                                          and d.series_number = 'F002-000450')
              ) then
                raise exception 'el trabajo no se llevó el neto de su factura';
              end if;

              -- Lo facturado se reparte entre las líneas aprobadas, así que la
              -- suma de las partes es el neto de los documentos de esa cotización.
              if not exists (select 1 from job_margins
                              where organization_id = v_org and ingreso_neto > 0) then
                raise exception 'ningún trabajo se llevó su parte de lo facturado';
              end if;

              -- Y el tiempo: cinco apuntes, dos personas, y ni un céntimo de
              -- diferencia en el costo (INV-16.1).
              select coalesce(sum(minutos), 0) into v_cuantas from job_time t
                join jobs j on j.id = t.job_id where j.organization_id = v_org;
              if v_cuantas <> 1140 then raise exception 'la demo necesita 1140 minutos, hay %', v_cuantas; end if;

              -- Un extracto de tres líneas, una de ellas ya cuadrada.
              select count(*) into v_cuantas from bank_statement_lines
               where organization_id = v_org;
              if v_cuantas <> 3 then raise exception 'la demo necesita tres líneas de extracto, hay %', v_cuantas; end if;

              select count(*) into v_cuantas from bank_line_status s
               where s.organization_id = v_org and s.cuadra;
              if v_cuantas <> 1 then raise exception 'la demo necesita una línea cuadrada, hay %', v_cuantas; end if;

              -- Dos previstos de una sola vez, sin cotización detrás.
              select count(*) into v_cuantas from payment_schedule_items
               where organization_id = v_org and quote_id is null;
              if v_cuantas <> 2 then raise exception 'la demo necesita dos previstos, hay %', v_cuantas; end if;

              -- Y el que se adelantó a medias sigue siendo un plan: si pasara a
              -- «settled», la proyección dejaría de ver los 2000 que faltan.
              if not exists (
                select 1 from payment_schedule_items
                 where organization_id = v_org and quote_id is null
                   and label like 'Cámara%' and status = 'planned') then
                raise exception 'el previsto adelantado a medias no sigue siendo un plan';
              end if;

              raise notice 'Demo comprobada: % hechos económicos', v_cuantas;
            end \$$;"
          psql -v ON_ERROR_STOP=1 -f supabase/seed/borrar-demo.sql
          psql -v ON_ERROR_STOP=1 -c "
            do \$$
            begin
              if exists (select 1 from organizations where slug = 'margen-demo') then
                raise exception 'borrar-demo.sql no la quitó';
              end if;
            end \$$;"

      # Una migración que no se puede volver a aplicar sobre una base limpia
      # es una migración que no sirve: se comprueba en cada PR.
      #
      # storage también se tira: las políticas del bucket de marcas viven ahí y
      # no en public, así que sobrevivirían al borrado y la segunda pasada
      # fallaría por una política que ya existe.
      - name: Reaplicar desde cero
        run: |
          psql -v ON_ERROR_STOP=1 -c 'drop schema public cascade; create schema public; drop schema app cascade; drop schema storage cascade;'
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/auth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/stubs/storage.sql
          for file in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
