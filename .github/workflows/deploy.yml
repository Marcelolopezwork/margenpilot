name: Desplegar

# Cada push a main que pase la CI deja el sitio al día en SiteGround. Existe
# porque mandar un zip a mano garantiza que antes o después se sirva un build
# caducado, y entonces se culpa a la caché del navegador durante media hora.
#
# Inerte hasta que existan los secretos: si falta alguno, el trabajo se salta
# y no rompe nada.
#
# Secretos (Settings → Secrets and variables → Actions):
#   SG_HOST        el servidor (Site Tools → Site → FTP Accounts)
#   SG_USER        el usuario de esa cuenta FTP
#   SG_PASS        su contraseña
#   SG_REMOTE_DIR  carpeta destino RELATIVA a donde aterriza la cuenta. Si la
#                  cuenta ya apunta al subdominio, es un punto: .
#   SG_PROTOCOL    opcional: «ftp» (por defecto) o «sftp». SiteGround suele
#                  tener el SSH con clave y no con contraseña, así que la vía
#                  que funciona con usuario y contraseña es FTP sobre TLS.
#   SG_PORT        opcional: 21 para ftp, 18765 para sftp
#   VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY, que se empotran en el build
#
# Las claves de Supabase son públicas por diseño: lo que protege la base es
# RLS (ADR-25), no que la clave sea secreta. Van en secretos igualmente para
# no tenerlas escritas en el repositorio.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: true

jobs:
  subir:
    name: Subir dist a SiteGround
    runs-on: ubuntu-latest
    # Solo si la CI pasó: nunca se despliega algo que no compiló.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: ¿Están los secretos?
        id: listo
        env:
          HOST: ${{ secrets.SG_HOST }}
          DIR: ${{ secrets.SG_REMOTE_DIR }}
        run: |
          if [ -n "$HOST" ] && [ -n "$DIR" ]; then
            echo "ok=si" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "Faltan secretos de despliegue: no se sube nada." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.listo.outputs.ok == 'si'
        with:
          node-version: 20
          cache: npm

      - name: Compilar
        if: steps.listo.outputs.ok == 'si'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npx vite build

      - name: Comprobar que el build salió entero
        if: steps.listo.outputs.ok == 'si'
        run: |
          test -f dist/index.html || { echo "no hay index.html"; exit 1; }
          test -f dist/.htaccess  || { echo "falta .htaccess: las rutas darían 404"; exit 1; }
          grep -q 'assets/index-' dist/index.html || { echo "el html no apunta a ningún bundle"; exit 1; }

      - name: Subir por SFTP
        if: steps.listo.outputs.ok == 'si'
        env:
          HOST: ${{ secrets.SG_HOST }}
          USUARIO: ${{ secrets.SG_USER }}
          CLAVE: ${{ secrets.SG_PASS }}
          PROTO: ${{ secrets.SG_PROTOCOL }}
          PUERTO: ${{ secrets.SG_PORT }}
          DIR: ${{ secrets.SG_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          proto="${PROTO:-ftp}"
          if [ "$proto" = "sftp" ]; then
            puerto="${PUERTO:-18765}"
            ajustes="set sftp:auto-confirm yes;"
          else
            puerto="${PUERTO:-21}"
            # FTP a secas manda la contraseña en claro: se fuerza TLS.
            ajustes="set ftp:ssl-force true; set ftp:ssl-protect-data true;"
          fi
          # Sin --delete a propósito: los assets viejos llevan hash en el
          # nombre y no estorban, mientras que un --delete con la carpeta mal
          # puesta se lleva por delante lo que haya.
          lftp -c "
            $ajustes
            set net:max-retries 3;
            set cmd:fail-exit true;
            open -u '$USUARIO','$CLAVE' -p '$puerto' $proto://$HOST;
            mirror -R --verbose --exclude '\.map$' dist/ '$DIR';
          "

      # El dominio está detrás del antibot de SiteGround: a un curl le contesta
      # con un reto, no con la página. Así que esto confirma cuando puede y
      # avisa cuando no, y solo se pone rojo si el dominio sirve un bundle
      # DISTINTO del que acabamos de subir, que es lo único que de verdad
      # significa que SG_REMOTE_DIR apunta a la carpeta equivocada.
      - name: Confirmar qué quedó servido
        if: steps.listo.outputs.ok == 'si'
        run: |
          esperado=$(grep -oE 'assets/index-[A-Za-z0-9._-]+\.js' dist/index.html | head -1)
          respuesta=$(curl -sS -L --max-time 30 "https://crm.thepublisherlab.com" || true)
          sirviendo=$(printf '%s' "$respuesta" | grep -oE 'assets/index-[A-Za-z0-9._-]+\.js' | head -1)
          echo "esperado:  $esperado"
          echo "sirviendo: ${sirviendo:-(no se pudo leer)}"
          if [ "$esperado" = "$sirviendo" ]; then
            echo "Desplegado y comprobado: $esperado" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$sirviendo" ]; then
            echo "Subido $esperado. El antibot de SiteGround no deja leer el dominio desde aquí, así que la comprobación no se pudo hacer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "El dominio sirve $sirviendo y acabamos de subir $esperado. Revisa SG_REMOTE_DIR." >&2
            exit 1
          fi
